        too_many_designs: "You can keep up to 50 custom design systems. Delete one first."
        name: "Give the design system a name of at most 80 characters."
    marker:
      title: "Environment marker"
      hint: "A label at the top of every page, such as Test or Acceptance, so nobody works in the wrong OpenProject. Leave the label empty for none. The environment variable %{variable} sets the label as code and wins over this field."
