      title: "Your own tokens"
      hint: "Add a token of your organisation. It is written as --thematiq-org-<name> on every page, with a dark value for OpenProject's dark theme if you give one, so your own CSS and other plugins can use it. Other apps read the list at /thematiq/api/v1/own-tokens."
