      at: "From"
      at_hint: "In your time zone, %{zone}."
      save: "Plan the switch"
      entry: "%{name} from %{time}"
      cancel: "Cancel"
      cancel_label: "Cancel the switch to %{name}"
      notice_planned: "%{name} is planned from %{time}."
      notice_cancelled: "The planned switch is cancelled."
