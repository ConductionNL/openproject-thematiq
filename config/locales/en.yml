        dark: "The dark value is not a colour the plugin accepts."
        label: "The label may hold up to 80 characters, without markup."
        too_many: "You can keep up to 100 own tokens."
    custom_css:
      title: "Your own CSS"
      hint: "For what the tokens cannot say. Style rules and @media blocks only, up to %{size}: no @import, no @font-face, no url(), no escapes. The plugin reads the CSS part by part and writes it anew; when one part does not fit, nothing is saved and the parts are named. It comes last on every page, so it wins. Off until you turn it on."
