        unknown_set: "Choose a design system from the list."
        time: "Choose a date and time in the future."
        too_many: "You can plan up to 20 switches."
    locks:
      label: "Lock this project's design system"
      hint: "Project admins can no longer change it here. Only an instance admin can, and only an instance admin unlocks it."
      read_only: "An instance admin locked the design system of this project. You can see it, not change it."
      admin_note: "This project's design system is locked: its project admins cannot change it."
    library:
      title: "Font library"
      hint: "Fonts of your organisation, uploaded once. Every design system whose font names the family uses them, the shipped ones too. A design system's own upload of the same family wins. Up to %{count} files."
      empty: "No font in the library yet."
      upload: "Add to the library"
    nlds:
      file: "An NL Design System theme"
      hint: "A built theme CSS (custom properties in a theme class), a W3C Design Tokens JSON or a Style Dictionary tokens.json. thematiq's converter table decides what each token becomes; what the theme lacks is worked out the way thematiq does. Component tokens are not carried. It becomes a new custom design system; nothing is applied."
      prefix: "Brand prefix"
      prefix_hint: "The first part of the theme's own token names, such as zwolle in --zwolle-color-primary. Empty: the plugin guesses it."
      submit: "Convert the theme"
      default_name: "From an NL Design System theme"
      report_title: "What the conversion gave"
      report_description: "The custom design system \"%{name}\" is added. Pick it in the list and apply it when you are ready."
      read: "Read as %{kind}, brand prefix %{prefix}."
      no_prefix: "none"
      target: "thematiq token"
      value: "Value"
      how: "How"
      hows:
        applied: "from the theme"
        fallback-literal: "the table's value"
        fallback-ramp: "the table's grey"
        fallback-derive: "worked out"
      skipped_title: "Left out, by thematiq's table"
      kept: "Kept in the design system:"
