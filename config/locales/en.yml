        too_large: "The CSS is larger than 64 KB"
        encoding: "The CSS is not UTF-8 text"
        escape: "A backslash: escapes are not allowed"
        markup: "Markup such as a tag is not allowed"
        at_rule: "Only @media is allowed"
        nested_at_rule: "An at-rule inside @media is not allowed"
        stray_text: "Text outside a rule, such as @import"
        unclosed: "A block that is not closed"
