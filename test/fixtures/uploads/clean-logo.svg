<?xml version="1.0" encoding="UTF-8"?>
<!-- a logo as a drawing program exports it -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 120 30" width="120" height="30">
  <title>House style</title>
  <defs>
    <style>.mark{fill:#aa0055;} .word{fill:#ffffff;font-family:'Fira Sans',sans-serif}</style>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#aa0055"/>
      <stop offset="1" stop-color="#550033"/>
    </linearGradient>
    <clipPath id="box"><rect width="30" height="30"/></clipPath>
  </defs>
  <g clip-path="url(#box)"><rect class="mark" width="30" height="30" fill="url(#fade)"/></g>
  <use xlink:href="#fade"/>
  <text class="word" x="38" y="21" font-size="16">House &amp; style</text>
</svg>
