# Try the plugin on your own machine: OpenProject 17 with this plugin, on localhost only.
# From the repository root: docker compose -f docker/compose.yml up -d --build
# This is for trying it out. It is not a production setup: it runs without HTTPS.
name: openproject-thematiq-try

services:
  openproject:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: openproject-thematiq:try
    # Only this machine can reach it.
    ports:
      - "127.0.0.1:${THEMATIQ_PORT:-8080}:80"
    environment:
      OPENPROJECT_HOST__NAME: "localhost:${THEMATIQ_PORT:-8080}"
      OPENPROJECT_HTTPS: "false"
      OPENPROJECT_DEFAULT__LANGUAGE: "en"
      # Names the design system as code; it wins over the admin page. Empty: the admin page decides.
      THEMATIQ_DESIGN_SYSTEM: "${THEMATIQ_DESIGN_SYSTEM:-}"
      # Turns /thematiq/metrics on for a Prometheus scraper with this bearer token, 24 characters at least. Empty: off.
      THEMATIQ_METRICS_TOKEN: "${THEMATIQ_METRICS_TOKEN:-}"
      # A configuration file to make the setup at start, when it changed since last time. Mount it into the container.
      THEMATIQ_BUNDLE_FILE: "${THEMATIQ_BUNDLE_FILE:-}"
    # OpenProject needs the same SECRET_KEY_BASE on every start. No secret is written in this file:
    # the first start makes a random one and keeps it in the "secret" volume.
    # The variable only reaches the main process. A command run with `docker compose exec` gets the image's
    # placeholder, and `rails runner` stops on it. So the start also writes a login script that reads the
    # same file: `docker compose exec openproject bash -lc '...'` then has the secret too. The script
    # holds no secret, only the path.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        file=/var/openproject/secret/secret_key_base
        if [ ! -s "$$file" ]; then
          (umask 077 && openssl rand -hex 64 > "$$file")
        fi
        printf '%s\n' \
          "# Written by docker/compose.yml: the secret of this instance for login shells." \
          "if [ -r $$file ]; then SECRET_KEY_BASE=\"\$$(cat $$file)\"; export SECRET_KEY_BASE; fi" \
          > /etc/profile.d/thematiq-secret.sh
        SECRET_KEY_BASE="$$(cat "$$file")"
        export SECRET_KEY_BASE
        exec ./docker/prod/entrypoint.sh ./docker/prod/supervisord
    volumes:
      - pgdata:/var/openproject/pgdata
      - assets:/var/openproject/assets
      - secret:/var/openproject/secret
    stop_grace_period: 90s

volumes:
  pgdata:
  assets:
  secret:
