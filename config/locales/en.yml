        too_many_designs: "You can keep up to 50 custom design systems. Delete one first."
        name: "Give the design system a name of at most 80 characters."
        prefix: "The brand prefix may hold lowercase letters, digits and dashes, starting with a letter."
    css_upload:
      file: "A CSS file of design tokens"
      hint: "Custom properties as thematiq writes them in a token set: --nldesign-color-primary and so on, the dark values in a block or media query that says dark. References with var() are followed to their value. The file becomes a new custom design system; nothing is applied."
      submit: "Read the CSS file"
      default_name: "From a CSS file"
      report_title: "What the CSS file gave"
      report_description: "The custom design system \"%{name}\" is added. Pick it in the list and apply it when you are ready."
