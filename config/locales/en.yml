    email:
      title: "E-mail"
      hint: "E-mail in the house style: a band in the primary colour with the app's title and the logo at the top, and your organisation's text and the legal links at the end. OpenProject's own header and footer texts stay. Off until you turn it on."
      styled: "Send e-mail in the house style"
      footer: "Text under every e-mail"
      footer_hint: "For example the organisation's name, address and legal text. Plain text, at most %{count} characters; lines are kept."
      save: "Save e-mail settings"
      notice_saved: "The e-mail settings are saved."
      error_invalid: "The text may hold at most %{count} characters and no < or >. Nothing was saved."
    footer:
      title: "Legal links"
      hint: "A privacy statement, an imprint and an accessibility statement, as links at the end of every page and on the sign-in page. They open in a new tab. Leave a field empty for no link. The footer takes the design system's footer colours."
      region: "Legal information"
      save: "Save links"
      links:
        privacy: "Privacy statement"
        imprint: "Imprint"
        accessibility: "Accessibility statement"
      notice_saved: "The links are saved."
      error_invalid: "Each link must be an http or https address of at most 500 characters. Nothing was saved."
    schedule:
      title: "Planned switch"
      hint: "Plan a design system for a date and time, such as a campaign or a holiday look. The first page after that time makes the switch, for everyone, and the history names it. To go back afterwards, plan the design system of now for a later time."
