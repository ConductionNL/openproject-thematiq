# The nightly catalogue sync (syn-nightly-pr): reads thematiq's published shell catalogue and, when it is newer than the
# one in this repository, opens a pull request that replaces data/catalogue/shell-catalogue.json. Nothing merges by
# itself: the pull request runs the usual checks, and a maintainer copies any new logo or font by hand
# (docs/catalogue.md, "Replace the catalogue"). The repository must allow GitHub Actions to open pull requests.
name: Catalogue sync

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: catalogue-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - name: Read thematiq's catalogue
        run: |
          curl --fail --silent --show-error --max-time 60 --proto '=https' \
            https://raw.githubusercontent.com/ConductionNL/thematiq/development/docs/reference/shell-catalogue.json -o /tmp/catalogue.json
          python3 -c "import json; d=json.load(open('/tmp/catalogue.json')); assert d.get('version') == 1 and d.get('sets'), 'not a catalogue'"
      # thematiq publishes generated_from as "sets:<hash>". The plugin names the thematiq commit as well, as
      # "thematiq development <commit> sets:<hash>": the last commit on thematiq's development that wrote the file.
      # Only the generated_from value changes; the rest of the file stays byte for byte as thematiq wrote it.
      - name: Name the thematiq commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit=$(gh api "repos/ConductionNL/thematiq/commits?path=docs/reference/shell-catalogue.json&sha=development&per_page=1" --jq '.[0].sha[0:8]')
          echo "$commit" | grep -Eq '^[0-9a-f]{8}$'
          COMMIT="$commit" python3 - <<'PY'
          import json, os
          path = "/tmp/catalogue.json"
          text = open(path, encoding="utf-8").read()
          published = json.loads(text)["generated_from"]
          assert published.startswith("sets:"), published
          old = '"generated_from": ' + json.dumps(published)
          assert text.count(old) == 1, "generated_from is not written once as expected"
          text = text.replace(old, '"generated_from": ' + json.dumps(f"thematiq development {os.environ['COMMIT']} {published}"))
          open(path, "w", encoding="utf-8").write(text)
          PY
      # The documentation address of each design system ("documentation_url" in thematiq's design-systems.json) goes to
      # data/catalogue/design-systems.json. Only http and https addresses are kept; the plugin checks them again on load.
      - name: Read thematiq's design systems
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --max-time 60 --proto '=https' \
            https://raw.githubusercontent.com/ConductionNL/thematiq/development/design-systems.json -o /tmp/thematiq-design-systems.json
          commit=$(gh api "repos/ConductionNL/thematiq/commits?path=design-systems.json&sha=development&per_page=1" --jq '.[0].sha[0:8]')
          echo "$commit" | grep -Eq '^[0-9a-f]{8}$'
          COMMIT="$commit" python3 - <<'PY'
          import json, os, re
          systems = json.load(open("/tmp/thematiq-design-systems.json", encoding="utf-8"))
          assert isinstance(systems, list) and systems, "not a list of design systems"
          docs = {}
          for entry in systems:
              url = entry.get("documentation_url") if isinstance(entry, dict) else None
              if isinstance(url, str) and re.fullmatch(r"https?://[^\s\"'<>\\]{1,490}", url) and isinstance(entry.get("id"), str):
                  docs[entry["id"]] = url
          old = json.load(open("data/catalogue/design-systems.json", encoding="utf-8"))
          if old.get("documentation") == docs:
              raise SystemExit(0)
          document = {"generated_from": f"thematiq development {os.environ['COMMIT']}: design-systems.json", "documentation": docs}
          with open("data/catalogue/design-systems.json", "w", encoding="utf-8") as handle:
              handle.write(json.dumps(document, indent=2) + "\n")
          PY
      - name: Compare
        id: compare
        run: |
          # Compared by the sets hash only, so a new thematiq commit that wrote the same sets proposes nothing.
          new=$(python3 -c "import json; print(json.load(open('/tmp/catalogue.json')).get('generated_from',''))")
          old=$(python3 -c "import json; print(json.load(open('data/catalogue/shell-catalogue.json')).get('generated_from',''))")
          echo "new=$new" >> "$GITHUB_OUTPUT"
          # A changed documentation address alone proposes a pull request as well.
          if [ "${new##* }" = "${old##* }" ] && git diff --quiet -- data/catalogue/design-systems.json; then
            echo "same=true" >> "$GITHUB_OUTPUT"
          else
            echo "same=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Open a pull request
        if: steps.compare.outputs.same == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GENERATED_FROM: ${{ steps.compare.outputs.new }}
        run: |
          branch="chore/catalogue-sync-$(date -u +%Y%m%d)"
          if git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null; then echo "already proposed today"; exit 0; fi
          cp /tmp/catalogue.json data/catalogue/shell-catalogue.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/catalogue/shell-catalogue.json data/catalogue/design-systems.json
          git commit -m "chore(catalogue): thematiq's catalogue of ${GENERATED_FROM}"
          git push origin "$branch"
          gh pr create --base development --head "$branch" --title "chore(catalogue): thematiq's catalogue of ${GENERATED_FROM}" \
            --body "The nightly sync found a newer catalogue in thematiq. Before merging, copy any new logo or font that the catalogue marks redistributable (docs/catalogue.md, Replace the catalogue), and change the number of sets in test/catalogue_test.rb when it changed."
