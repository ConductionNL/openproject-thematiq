      title: "Design systems per group"
      hint: "Give a group of people its own design system on this shared OpenProject. A person in several groups gets the design system of the first one in this list. It takes the place of the instance's design system for them; a project's or a module's own design system still wins, and the sign-in page keeps the instance's."
